[project]
name = "trunkver"
version = "0.1.0.0"
description = "Calculates current repository version for trunk-based git strategy"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["pyyaml==6.0.2"]

[project.scripts]
trunkver = "trunkver:run"

[tool.uv]
dev-dependencies = ["pre-commit==4.2.0", "pytest==8.3.5", "ruff==0.11.7"]

[[tool.uv.index]]
name = "testpypi"
url = "https://github.com/tarikporto/trunkver"
publish-url = "https://test.pypi.org/simple/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
